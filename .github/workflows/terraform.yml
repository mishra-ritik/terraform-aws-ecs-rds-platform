name: Terraform

# Runs on PRs that touch infra/. For each environment it runs
# fmt -> init -> validate -> plan, then posts the plan back on the PR
# (both as a comment and as an uploaded artifact).
on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"

permissions:
  contents: read
  pull-requests: write # needed to post the plan comment

jobs:
  terraform:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [dev, prod]

    defaults:
      run:
        working-directory: infra/envs/${{ matrix.env }}

    env:
      # Dummy secret so `terraform plan` can render without a real secret store.
      TF_VAR_db_password: "ci-placeholder-password"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"

      - name: Terraform fmt
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform init
        id: init
        # No credentials in CI -> plan-only, skip backend init.
        run: terraform init -backend=false

      - name: Terraform validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform plan
        id: plan
        # -refresh=false and -input=false: no AWS calls / no prompts in CI.
        run: terraform plan -no-color -input=false -refresh=false -out=tfplan
        continue-on-error: true

      - name: Save plan to text file
        run: terraform show -no-color tfplan > plan_${{ matrix.env }}.txt

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.env }}
          path: infra/envs/${{ matrix.env }}/plan_${{ matrix.env }}.txt

      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const env = '${{ matrix.env }}';
            const plan = fs.readFileSync(
              `infra/envs/${env}/plan_${env}.txt`, 'utf8'
            );
            const truncated = plan.length > 60000
              ? plan.slice(0, 60000) + '\n... (truncated, see artifact)'
              : plan;
            const body = [
              `### Terraform Plan — \`${env}\``,
              `- fmt: \`${{ steps.fmt.outcome }}\``,
              `- init: \`${{ steps.init.outcome }}\``,
              `- validate: \`${{ steps.validate.outcome }}\``,
              `- plan: \`${{ steps.plan.outcome }}\``,
              '',
              '<details><summary>Show plan</summary>',
              '',
              '```',
              truncated,
              '```',
              '</details>',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
